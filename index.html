<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">

    <title>williembonvnte</title>
    <link rel="stylesheet" href="./css/dialog.css">
    <link rel="stylesheet" href="./css/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>

<body>

    <div class="layout-wrapper">

        <aside class="sidebar">
            <div class="sidebar-top">

                <h1>Willie M. Bonavente</h1>
                <h2>Software Developer</h2>
                <p class="bio"></p>

                <!-- Anchor Navigation -->
                <nav class="side-nav">
                    <button type="button" class="nav-link" id="about" data-dialog="dialog-about">01. About Me</button>
                    <button type="button" class="nav-link" id="certs" data-dialog="dialog-certs">02. List of
                        Certifications</button>
                    <button type="button" class="nav-link" id="tech-stack" data-dialog="dialog-skills">03. Tech
                        Stack</button>
                    <button type="button" class="nav-link piano-nav-trigger" data-dialog="piano">
                        <span class="nav-num">04.</span> Play Piano
                    </button>

                </nav>
            </div>

            <!-- Socials & Quick Copy Email -->
            <div class="sidebar-bottom">
                <button id="copy-email-btn" class="email-btn" data-email="williebonavente@gmail.com">
                    <span id="email-text">williebonavente@gmail.com</span>
                    <span class="copy-tag" id="copy-status">Copy</span>
                </button>
                <div class="social-row">
                    <a href="https://github.com/williebonavente" target="_blank" rel="noreferrer">GitHub ↗</a>
                    <a href="https://www.linkedin.com/in/willie-bonavente-828180207" target="_blank"
                        rel="noreferrer">LinkedIn ↗</a>
                    <a href="./assets/resume/Bonavente_Willie_Resume_.pdf" target="_blank" rel="noreferrer">Resume ↗</a>
                </div>
            </div>
        </aside>


        <!-- RIGHT SCROLLABLE CONTENT -->
        <main class="content">
            <!-- PROJECTS SECTION -->
            <section id="projects" class="section">

                <div class="section-header">
                    <h3 class="section-label">Featured Works</h3>
                    <select id="theme-select" class="theme-select" aria-label="Select color theme">
                    </select>
                </div>


                <div class="project-list"></div>

                <!-- Pagination -->
                <nav class="page" id="pagination-controls" aria-label="Pagination" style="display:none">
                    <button type="button" class="prev" id="prev-btn" aria-label="Previous page">&lt; Prev</button>
                    <span class="current-page" id="page-indicator">1 of 1</span>
                    <button type="button" class="next" id="next-btn" aria-label="Next page">Next &gt;</button>
                </nav>
            </section>

            <footer class="footer">
                <p>Designed & Built by Willie M. Bonavente © 2026</p>
            </footer>
        </main>
    </div>

    <!-- DATA -->

    <script src="./js/dialogProject.js"></script>
    <script src="./js/dialogsData.js"></script>
    <script src="./js/themesData.js"></script>
    
    <!-- FUNCTIONS -->
    
    <script src="./js/index.js"></script>
    <script src="./js/projects.js"></script>
    <script src="./js/renderProject.js"></script>

    <script src="./js/piano/pianoNotes.js"></script>

    <script src="./js/piano/stopDemo.js"></script>
    
    <script>
        const saved = localStorage.getItem('portfolio-theme');
        if (saved && saved !== 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
        }
        </script>

<script src="./js/themeApplyer.js"></script>
